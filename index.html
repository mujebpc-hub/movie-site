<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Stream - Premium Movies</title>
    <!-- CSS Infrastructure Fixed -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body>

    <!-- 1. Header & Search Bar -->
    <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-xl">
        <div class="text-2xl font-black text-red-600 tracking-widest">CINEMATIC</div>
        <div class="w-1/3">
            <input type="text" placeholder="Search movies, genres..." class="w-full bg-white/10 text-white rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 border border-white/5">
        </div>
        <div class="flex gap-6 text-sm font-semibold text-gray-400">
            <a href="#" class="hover:text-white transition">Home</a>
            <a href="#" class="hover:text-white transition">Movies</a>
        </div>
    </nav>

    <!-- 2. Video Player Section -->
    <header class="max-w-6xl mx-auto mt-8 p-4">
        <div class="glass rounded-2xl overflow-hidden p-6 shadow-2xl">
            <h2 class="text-xs font-bold text-red-500 tracking-widest mb-2">NOW STREAMING</h2>
            <h1 class="text-3xl font-extrabold mb-4">Sample Classic Movie Stream</h1>
            
            <!-- Video Player Box -->
            <div class="relative aspect-video w-full rounded-xl overflow-hidden bg-black border border-white/10 shadow-inner">
                <iframe class="w-full h-full" src="https://youtube.com" title="Movie Player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            
            <p class="text-gray-400 text-sm mt-4 leading-relaxed">This is your official streaming infrastructure. You can replace the embed link inside the code to update or play any movie easily.</p>
        </div>
    </header>

    <!-- 3. Movie Management Library Grid -->
    <main class="max-w-6xl mx-auto p-4 mt-8 space-y-6 mb-12">
        <h2 class="text-xl font-bold border-l-4 border-red-600 pl-3 tracking-wide">Your Movie Library (Insert New Here)</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            
            <!-- Movie Thumbnail Card 1 -->
            <div class="glass rounded-xl overflow-hidden group cursor-pointer transition transform hover:scale-105 hover:border-red-500/50">
                <div class="aspect-[2/3] bg-gray-900 relative">
                    <img src="https://unsplash.com" alt="Movie Poster" class="w-full h-full object-cover">
                    <span class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">4K ULTRA HD</span>
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-sm truncate group-hover:text-red-500 transition">Sample Movie Title 1</h3>
                    <p class="text-xs text-gray-500 mt-1">Click to load into player</p>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
