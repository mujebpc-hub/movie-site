<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Movie Site</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }



        body{

            background:#111;

            color:white;
        }



        /* =========================
           TOP NAVBAR
        ========================== */

        .navbar{

            width:100%;

            background:white;

            padding:18px 40px;

            display:flex;

            justify-content:space-between;

            align-items:center;

            position:sticky;

            top:0;

            z-index:999;
        }



        .logo{

            font-size:40px;

            font-weight:bold;

            color:#7ac943;
        }



        .menu{

            display:flex;

            gap:30px;
        }



        .menu a{

            text-decoration:none;

            color:#111;

            font-weight:bold;

            font-size:15px;
        }



        .search-box{

            display:flex;

            align-items:center;
        }



        .search-box input{

            width:250px;

            padding:12px;

            border:1px solid #ccc;

            outline:none;
        }



        .search-box button{

            padding:12px 20px;

            border:none;

            background:#7ac943;

            color:white;

            cursor:pointer;
        }



        /* =========================
           HERO BANNER
        ========================== */

        .hero{

            width:100%;

            height:500px;

            background:url('my private 765675.png');

            background-size:cover;

            background-position:center;

            position:relative;
        }



        .overlay{

            width:100%;

            height:100%;

            background:rgba(0,0,0,0.5);

            display:flex;

            align-items:center;

            padding-left:80px;
        }



        .hero-content{

            max-width:500px;
        }



        .hero-content h1{

            font-size:60px;

            margin-bottom:20px;
        }



        .hero-content p{

            line-height:28px;

            margin-bottom:25px;

            color:#ddd;
        }



        .watch-btn{

            padding:15px 35px;

            background:#7ac943;

            color:white;

            border:none;

            font-size:18px;

            cursor:pointer;

            border-radius:5px;
        }



        /* =========================
           MOVIE SECTION
        ========================== */

        .section{

            padding:50px;
        }



        .section-title{

            font-size:30px;

            margin-bottom:30px;
        }



        .movie-grid{

            display:grid;

            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

            gap:25px;
        }



        .movie-card{

            background:#1b1b1b;

            border-radius:10px;

            overflow:hidden;

            cursor:pointer;

            transition:0.3s;
        }



        .movie-card:hover{

            transform:translateY(-8px);
        }



        .movie-card img{

            width:100%;

            height:320px;

            object-fit:cover;
        }



        .movie-info{

            padding:15px;
        }



        .movie-info h3{

            font-size:20px;

            margin-bottom:10px;
        }



        .movie-info button{

            padding:10px 18px;

            background:#7ac943;

            border:none;

            color:white;

            cursor:pointer;

            border-radius:5px;
        }



        /* =========================
           VIDEO MODAL
        ========================== */

        .movie-modal{

            position:fixed;

            top:0;

            left:0;

            width:100%;

            height:100%;

            background:rgba(0,0,0,0.95);

            display:none;

            justify-content:center;

            align-items:center;

            z-index:9999;

            padding:20px;
        }



        .modal-content{

            width:100%;

            max-width:1000px;

            position:relative;
        }



        .modal-content video{

            width:100%;

            border-radius:15px;
        }



        .close-btn{

            position:absolute;

            top:-50px;

            right:0;

            color:white;

            font-size:40px;

            cursor:pointer;
        }



        @media(max-width:768px){

            .navbar{

                flex-direction:column;

                gap:20px;
            }



            .menu{

                flex-wrap:wrap;

                justify-content:center;
            }



            .hero{

                height:400px;
            }



            .hero-content h1{

                font-size:40px;
            }

        }

    </style>

</head>

<body>



    <!-- =========================
         NAVBAR
    ========================== -->

    <div class="navbar">

        <div class="logo">
            MYMOVIES
        </div>



        <div class="menu">

            <a href="#">HOME</a>

            <a href="#">BOLLYWOOD</a>

            <a href="#">HOLLYWOOD</a>

            <a href="#">SERIES</a>

            <a href="#">TRENDING</a>

        </div>



        <div class="search-box">

            <input
                type="text"
                placeholder="Search movies..."
            >

            <button>
                Search
            </button>

        </div>

    </div>



    <!-- =========================
         HERO SECTION
    ========================== -->

    <div class="hero">

        <div class="overlay">

            <div class="hero-content">

                <h1>Meri Kayenat</h1>

                <p>

                    Watch your favorite movies online in HD quality.
                    Stream unlimited content with a modern movie experience.

                </p>

                <button
                    class="watch-btn"
                    onclick="playMovie('meri kayenat.mp4')"
                >
                    ▶ Watch Now
                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         MOVIE SECTION
    ========================== -->

    <div class="section">

        <h2 class="section-title">
            Latest Movies
        </h2>



        <div
            class="movie-grid"
            id="movieGrid"
        ></div>

    </div>



    <!-- =========================
         VIDEO MODAL
    ========================== -->

    <div
        class="movie-modal"
        id="movieModal"
    >

        <div class="modal-content">

            <span
                class="close-btn"
                onclick="closeMovie()"
            >
                ✕
            </span>



            <video
                id="moviePlayer"
                controls
                autoplay
            >

                <source
                    id="movieSource"
                    src=""
                    type="video/mp4"
                >

            </video>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        let movieDatabase = [

            {

                title:"Meri Kayenat",

                videoUrl:"meri kayenat.mp4",

                poster:"my private 765675.png"

            }

        ];



        function renderMovies(){

            const movieGrid = document.getElementById("movieGrid");



            movieDatabase.forEach((movie)=>{

                movieGrid.innerHTML += `

                    <div
                        class="movie-card"
                        onclick="playMovie('${movie.videoUrl}')"
                    >

                        <img src="${movie.poster}">

                        <div class="movie-info">

                            <h3>${movie.title}</h3>

                            <button>
                                ▶ Watch
                            </button>

                        </div>

                    </div>

                `;

            });

        }



        function playMovie(videoPath){

            const modal = document.getElementById("movieModal");

            const player = document.getElementById("moviePlayer");

            const source = document.getElementById("movieSource");



            source.src = videoPath;

            player.load();



            modal.style.display = "flex";

        }



        function closeMovie(){

            const modal = document.getElementById("movieModal");

            const player = document.getElementById("moviePlayer");



            modal.style.display = "none";

            player.pause();

        }



        renderMovies();

    </script>

</body>

</html>
