<!DOCTYPE html>
<html lang="en">

<head>
<link rel="icon" type="image/png" href="ChatGPT Image May 16, 2026, 07_45_35 PM.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MYMOVIES</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
}

/* =========================
   NAVBAR
========================= */

.navbar{
    width:100%;
    background:#111;
    padding:18px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
    z-index:999;
}

.logo{
    font-size:38px;
    font-weight:bold;
    color:#7ac943;
}

.menu{
    display:flex;
    gap:30px;
}

.menu button{
    background:none;
    border:none;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.menu button:hover{
    color:#7ac943;
}

.search-box{
    display:flex;
}

.search-box input{
    width:250px;
    padding:12px;
    border:none;
    outline:none;
    background:#222;
    color:white;
}

.search-box button{
    padding:12px 20px;
    border:none;
    background:#7ac943;
    color:white;
    cursor:pointer;
}

/* =========================
   HOME BANNER
========================= */

.home-banner{
    width:100%;
    height:420px;

    background:
    linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
    url('my private 765675.png');

    background-size:cover;
    background-position:center;

    display:flex;
    align-items:center;
    padding:60px;
}

.banner-content{
    max-width:600px;
}

.banner-content h1{
    font-size:60px;
    margin-bottom:20px;
}

.banner-content p{
    color:#ddd;
    line-height:30px;
    margin-bottom:30px;
}

.banner-btn{
    padding:15px 30px;
    border:none;
    background:#7ac943;
    color:white;
    font-size:18px;
    border-radius:5px;
    cursor:pointer;
}

/* =========================
   MOVIE SECTION
========================= */

.section{
    padding:50px 40px;
}

.section-title{
    font-size:35px;
    margin-bottom:30px;
}

/* =========================
   GRID
========================= */

.movie-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

/* =========================
   MOVIE CARD
========================= */

.movie-card{
    background:#1b1b1b;
    border-radius:12px;
    overflow:hidden;
    transition:0.3s;
}

.movie-card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 25px rgba(0,0,0,0.6);
}

.movie-poster{
    width:100%;
    height:320px;
    object-fit:cover;
}

.movie-info{
    padding:15px;
}

.movie-title{
    font-size:20px;
    margin-bottom:15px;
}

.watch-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#7ac943;
    color:white;
    font-size:16px;
    cursor:pointer;
    border-radius:5px;
}

/* =========================
   MODAL PLAYER
========================= */

.movie-modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
}

.modal-content{
    width:100%;
    max-width:1000px;
    position:relative;
}

.modal-content video{
    width:100%;
    border-radius:12px;
    background:black;
}

.close-btn{
    position:absolute;
    top:-50px;
    right:0;
    color:white;
    font-size:40px;
    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    .navbar{
        flex-direction:column;
        gap:20px;
    }

    .menu{
        flex-wrap:wrap;
        justify-content:center;
    }

    .home-banner{
        height:auto;
        padding:40px 20px;
    }

    .banner-content h1{
        font-size:40px;
    }

    .search-box input{
        width:180px;
    }

}

</style>

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<div class="navbar">

    <div class="logo">
        MYMOVIES
    </div>

    <div class="menu">

        <button onclick="filterCategory('all')">
            HOME
        </button>

        <button onclick="filterCategory('bollywood')">
            BOLLYWOOD
        </button>

        <button onclick="filterCategory('hollywood')">
            HOLLYWOOD
        </button>

        <button onclick="filterCategory('song')">
            SONGS
        </button>

    </div>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search movies..."
            onkeyup="liveSearch()"
        >

        <button onclick="liveSearch()">
            Search
        </button>

    </div>

</div>

<!-- =========================
     HOME BANNER
========================= -->

<div class="home-banner">

    <div class="banner-content">

        <h1>
            Watch Movies Online
        </h1>

        <p>
            Stream your favorite movies and songs online in HD quality.
        </p>

        <button
            class="banner-btn"
            onclick="playMovie('meri kayenat.mp4')"
        >
            ▶ Watch Now
        </button>

    </div>

</div>

<!-- =========================
     MOVIES
========================= -->

<div class="section">

    <h2 class="section-title">
        Latest Uploads
    </h2>

    <div
        class="movie-grid"
        id="movieGrid"
    ></div>

</div>

<!-- =========================
     VIDEO MODAL
========================= -->

<div
    class="movie-modal"
    id="movieModal"
>

    <div class="modal-content">

        <span
            class="close-btn"
            onclick="closeMovie()"
        >
            ✕
        </span>

        <video
            id="moviePlayer"
            controls
            autoplay
        >

            <source
                id="movieSource"
                src=""
                type="video/mp4"
            >

        </video>

    </div>

</div>

<!-- =========================
     JAVASCRIPT
========================= -->

<script>

/* =========================
   MOVIE DATABASE
========================= */

let movieDatabase = [

    {
        title:"Meri Kayenat",
        category:"song",
        videoUrl:"meri kayenat.mp4",
        poster:"my private 765675.png"
    },

    {
        title:"Pathaan",
        category:"bollywood",
        videoUrl:"pathaan.mp4",
        poster:"pathaan.png"
    },

    {
        title:"Avengers",
        category:"hollywood",
        videoUrl:"avengers.mp4",
        poster:"avengers.png"
    }

];

/* =========================
   RENDER MOVIES
========================= */

function renderMovies(movies){

    const movieGrid =
    document.getElementById("movieGrid");

    movieGrid.innerHTML = "";

    if(movies.length === 0){

        movieGrid.innerHTML = `
            <h2>No Movie Found</h2>
        `;

        return;
    }

    movies.forEach((movie)=>{

        movieGrid.innerHTML += `

            <div class="movie-card">

                <img
                    src="${movie.poster}"
                    class="movie-poster"
                >

                <div class="movie-info">

                    <h3 class="movie-title">
                        ${movie.title}
                    </h3>

                    <button
                        class="watch-btn"
                        onclick="playMovie('${movie.videoUrl}')"
                    >
                        ▶ Watch Now
                    </button>

                </div>

            </div>

        `;

    });

}

/* =========================
   PLAY MOVIE
========================= */

function playMovie(videoPath){

    const modal =
    document.getElementById("movieModal");

    const player =
    document.getElementById("moviePlayer");

    const source =
    document.getElementById("movieSource");

    source.src = videoPath;

    player.load();

    modal.style.display = "flex";

}

/* =========================
   CLOSE MOVIE
========================= */

function closeMovie(){

    const modal =
    document.getElementById("movieModal");

    const player =
    document.getElementById("moviePlayer");

    modal.style.display = "none";

    player.pause();

}

/* =========================
   LIVE SEARCH
========================= */

function liveSearch(){

    const searchValue =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

    const filteredMovies =
    movieDatabase.filter((movie)=>

        movie.title
        .toLowerCase()
        .includes(searchValue)

    );

    renderMovies(filteredMovies);

}

/* =========================
   CATEGORY FILTER
========================= */

function filterCategory(category){

    if(category === "all"){

        renderMovies(movieDatabase);

    }

    else{

        const filtered =
        movieDatabase.filter((movie)=>

            movie.category === category

        );

        renderMovies(filtered);

    }

}

/* =========================
   INITIAL LOAD
========================= */

renderMovies(movieDatabase);

</script>

</body>

</html>
