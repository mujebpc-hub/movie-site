<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MYMOVIES</title>

<link rel="icon" type="image/png" href="ffhhh.png">

<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
    padding-top:80px;
}

/* =========================
   NAVBAR
========================= */

.navbar{
    width:100%;
    height:70px;
    background:#111;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    position:fixed;
    top:0;
    left:0;
    z-index:9999;
    border-bottom:1px solid #222;
}

.logo{
    font-size:34px;
    font-weight:bold;
    color:white;
}

.logo span{
    color:#7ac943;
}

.menu{
    display:flex;
    gap:25px;
}

.menu button{
    background:none;
    border:none;
    color:#ccc;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.menu button:hover{
    color:#7ac943;
}

.search-box{
    display:flex;
    background:#1b1b1b;
    border-radius:6px;
    overflow:hidden;
}

.search-box input{
    width:220px;
    padding:12px;
    border:none;
    outline:none;
    background:transparent;
    color:white;
}

.search-box button{
    padding:12px 18px;
    border:none;
    background:#7ac943;
    color:white;
    cursor:pointer;
}

/* =========================
   BANNER
========================= */

.home-banner{
    width:100%;
    height:420px;

    background:
    linear-gradient(to right,
    rgba(0,0,0,0.9),
    rgba(0,0,0,0.4)),
    url('ffhhh.png');

    background-size:cover;
    background-position:center;

    display:flex;
    align-items:center;

    padding:60px;
}

.banner-content{
    max-width:600px;
}

.banner-content h1{
    font-size:60px;
    margin-bottom:20px;
}

.banner-content p{
    color:#ddd;
    line-height:30px;
    margin-bottom:30px;
}

.banner-btn{
    padding:15px 30px;
    border:none;
    background:#7ac943;
    color:white;
    font-size:18px;
    border-radius:6px;
    cursor:pointer;
}

/* =========================
   SECTION
========================= */

.section{
    padding:50px 40px;
}

.section-title{
    font-size:35px;
    margin-bottom:30px;
}

/* =========================
   MOVIE GRID
========================= */

.movie-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

/* =========================
   MOVIE CARD
========================= */

.movie-card{
    background:#1b1b1b;
    border-radius:12px;
    overflow:hidden;
    transition:0.3s;
}

.movie-card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 25px rgba(0,0,0,0.6);
}

.movie-poster{
    width:100%;
    height:320px;
    object-fit:cover;
}

.movie-info{
    padding:15px;
}

.movie-title{
    font-size:20px;
    margin-bottom:15px;
}

.watch-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#2196f3;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

/* =========================
   MOVIE MODAL
========================= */

.movie-modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:99999;
    padding:20px;
}

.modal-content{
    width:100%;
    max-width:1000px;
    position:relative;
}

.modal-content video{
    width:100%;
    border-radius:12px;
    background:black;
}

.close-btn{
    position:absolute;
    top:-50px;
    right:0;
    font-size:40px;
    color:white;
    cursor:pointer;
}

/* =========================
   LOGIN MODAL
========================= */

.login-modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:100000;
}

.login-box{
    width:350px;
    background:#1b1b1b;
    padding:30px;
    border-radius:12px;
    text-align:center;
}

.login-box h2{
    margin-bottom:15px;
}

.login-box p{
    margin-bottom:20px;
    color:#ccc;
}

.google-btn,
#saveUserBtn{
    width:100%;
    padding:12px;
    border:none;
    background:#7ac943;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

#fullName{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    margin-bottom:15px;
    margin-top:15px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    body{
        padding-top:140px;
    }

    .navbar{
        height:auto;
        padding:20px;
        flex-direction:column;
        gap:20px;
    }

    .menu{
        flex-wrap:wrap;
        justify-content:center;
    }

    .home-banner{
        height:auto;
        padding:40px 20px;
    }

    .banner-content h1{
        font-size:40px;
    }

    .search-box input{
        width:160px;
    }

}

</style>

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<div class="navbar">

    <div class="logo">
        MY<span>MOVIES</span>
    </div>

    <div class="menu">

        <button onclick="filterCategory('all')">
            HOME
        </button>

        <button onclick="filterCategory('bollywood')">
            BOLLYWOOD
        </button>

        <button onclick="filterCategory('hollywood')">
            HOLLYWOOD
        </button>

        <button onclick="filterCategory('tollywood')">
            TOLLYWOOD
        </button>

        <button onclick="filterCategory('south')">
            SOUTH
        </button>

        <button onclick="filterCategory('song')">
            SONGS
        </button>

    </div>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search movies..."
            onkeyup="liveSearch()"
        >

        <button onclick="liveSearch()">
            Search
        </button>

    </div>

</div>

<!-- =========================
     HOME BANNER
========================= -->

<div class="home-banner">

    <div class="banner-content">

        <h1>
            Watch Movies Online
        </h1>

        <p>
            Stream your favorite movies and songs online in HD quality.
        </p>

        <button
            class="banner-btn"
            onclick="playMovie('meri kayenat.mp4')"
        >
            ▶ Watch Now
        </button>

    </div>

</div>

<!-- =========================
     MOVIE SECTION
========================= -->

<div class="section">

    <h2 class="section-title">
        Latest Uploads
    </h2>

    <div
        class="movie-grid"
        id="movieGrid"
    ></div>

</div>

<!-- =========================
     VIDEO PLAYER MODAL
========================= -->

<div
    class="movie-modal"
    id="movieModal"
>

    <div class="modal-content">

        <span
            class="close-btn"
            onclick="closeMovie()"
        >
            ✕
        </span>

        <video
            id="moviePlayer"
            controls
            autoplay
        >

            <source
                id="movieSource"
                src=""
                type="video/mp4"
            >

        </video>

    </div>

</div>

<!-- =========================
     LOGIN MODAL
========================= -->

<div id="loginModal" class="login-modal">

    <div class="login-box">

        <h2>Login Required</h2>

        <p>Please login to watch movies</p>

        <button
            id="googleLoginBtn"
            class="google-btn"
        >
            Continue with Google
        </button>

        <div
            id="userFormBox"
            style="display:none;"
        >

            <input
                type="text"
                id="fullName"
                placeholder="Enter Your Name"
            >

            <button id="saveUserBtn">
                Save & Continue
            </button>

        </div>

    </div>

</div>

<!-- =========================
     JAVASCRIPT
========================= -->

<script>

/* =========================
   MOVIE DATABASE
========================= */

let movieDatabase = [

    {
        title:"Meri Kayenat",
        category:"song",
        videoUrl:"meri kayenat.mp4",
        poster:"ffhhh.png"
    },

    {
        title:"yari",
        category:"song",
        videoUrl:"yari song.mp4",
        poster:"yari poster.png"
    },

    {
        title:"madam ji gunde",
        category:"song",
        videoUrl:"gunda movie.mp4",
        poster:"avengers.png"
    },

    {
        title:"satyammurti",
        category:"tollywood",
        videoUrl:"default.mp4",
        poster:"default.jpg"
    },

    {
        title:"housefull 5",
        category:"bollywood",
        videoUrl:"default.mp4",
        poster:"default.jpg"
    },

    {
        title:"kgf chapter 2",
        category:"south",
        videoUrl:"default.mp4",
        poster:"default.jpg"
    },

    {
        title:"pushpa 2",
        category:"tollywood",
        videoUrl:"default.mp4",
        poster:"default.jpg"
    },

    {
        title:"avengers endgame",
        category:"hollywood",
        videoUrl:"default.mp4",
        poster:"default.jpg"
    }

];

/* =========================
   RENDER MOVIES
========================= */

function renderMovies(movies){

    const movieGrid =
    document.getElementById("movieGrid");

    movieGrid.innerHTML = "";

    if(movies.length === 0){

        movieGrid.innerHTML =
        `<h2>No Movie Found</h2>`;

        return;
    }

    movies.forEach((movie)=>{

        movieGrid.innerHTML += `

        <div class="movie-card">

            <img
                src="${movie.poster}"
                class="movie-poster"
            >

            <div class="movie-info">

                <h3 class="movie-title">
                    ${movie.title}
                </h3>

                <button
                    class="watch-btn"
                    onclick="playMovie('${movie.videoUrl}')"
                >
                    ▶ Watch Now
                </button>

            </div>

        </div>

        `;

    });

}

/* =========================
   PLAY MOVIE
========================= */

function playMovie(videoPath){

    const modal =
    document.getElementById("movieModal");

    const player =
    document.getElementById("moviePlayer");

    const source =
    document.getElementById("movieSource");

    source.src = videoPath;

    player.load();

    modal.style.display = "flex";

}

/* =========================
   CLOSE MOVIE
========================= */

function closeMovie(){

    const modal =
    document.getElementById("movieModal");

    const player =
    document.getElementById("moviePlayer");

    modal.style.display = "none";

    player.pause();

}

/* =========================
   LIVE SEARCH
========================= */

function liveSearch(){

    const searchValue =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

    const filteredMovies =
    movieDatabase.filter((movie)=>

        movie.title
        .toLowerCase()
        .includes(searchValue)

    );

    renderMovies(filteredMovies);

}

/* =========================
   CATEGORY FILTER
========================= */

function filterCategory(category){

    if(category === "all"){

        renderMovies(movieDatabase);

    }

    else{

        const filtered =
        movieDatabase.filter((movie)=>

            movie.category === category

        );

        renderMovies(filtered);

    }

}

/* =========================
   LOGIN SYSTEM
========================= */

document
.getElementById("googleLoginBtn")
.addEventListener("click",()=>{

    document
    .getElementById("userFormBox")
    .style.display = "block";

});

document
.getElementById("saveUserBtn")
.addEventListener("click",()=>{

    const name =
    document.getElementById("fullName").value;

    if(name.trim() === ""){

        alert("Please Enter Your Name");

        return;
    }

    localStorage.setItem(
        "movieUser",
        name
    );

    document
    .getElementById("loginModal")
    .style.display = "none";

});

/* =========================
   AUTO LOGIN CHECK
========================= */

const savedUser =
localStorage.getItem("movieUser");

if(savedUser){

    document
    .getElementById("loginModal")
    .style.display = "none";

}

/* =========================
   INITIAL LOAD
========================= */

renderMovies(movieDatabase);

</script>

</body>
</html>
