<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY MOVIE SPACE</title>

<link rel="icon" type="image/png" href="ChatGPT Image May 16, 2026, 07_45_35 PM.png">

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>

/* =========================
GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#00050d;
color:white;
padding-top:80px;
transition:0.4s;
}

/* LIGHT THEME */

.light-theme{
background:white;
color:black;
}

.light-theme .navbar{
background:#f5f5f5;
}

.light-theme .movie-card{
background:#e9e9e9;
color:black;
}

.light-theme .chat-box{
background:#ddd;
color:black;
}

/* =========================
NAVBAR
========================= */

.navbar{
position:fixed;
top:0;
left:0;
width:100%;
height:80px;
background:#0f171e;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
z-index:99999;
}

.logo{
font-size:30px;
font-weight:bold;
}

.logo span{
color:#00a8e1;
}

.menu{
display:flex;
gap:18px;
flex-wrap:wrap;
}

.menu button{
background:none;
border:none;
color:#ccc;
cursor:pointer;
font-size:15px;
}

.menu button:hover{
color:white;
}

.search-box{
display:flex;
background:#1b2530;
border-radius:8px;
overflow:hidden;
}

.search-box input{
border:none;
background:transparent;
padding:12px;
width:220px;
color:white;
outline:none;
}

.search-box button{
border:none;
background:#00a8e1;
padding:12px 18px;
color:white;
cursor:pointer;
}

/* =========================
SETTINGS PANEL
========================= */

.settings-panel{
display:none;
position:fixed;
top:90px;
right:20px;
background:#1b2530;
padding:20px;
border-radius:12px;
z-index:999999;
width:250px;
}

.settings-panel button{
width:100%;
margin-bottom:10px;
padding:12px;
border:none;
background:#00a8e1;
color:white;
border-radius:8px;
cursor:pointer;
}

/* =========================
BANNER
========================= */

.home-banner{
width:100%;
height:520px;

background:
linear-gradient(to right,
rgba(0,0,0,0.9),
rgba(0,0,0,0.4)),
url('ffhhh.png');

background-size:cover;
background-position:center;

display:flex;
align-items:center;

padding:60px;
}

.banner-content{
max-width:600px;
}

.banner-content h1{
font-size:65px;
margin-bottom:20px;
}

.banner-content p{
line-height:30px;
margin-bottom:30px;
color:#ddd;
}

.banner-btn{
padding:15px 35px;
border:none;
background:white;
color:black;
font-size:18px;
border-radius:8px;
cursor:pointer;
}

/* =========================
SECTION
========================= */

.section{
padding:40px;
}

.section-title{
font-size:32px;
margin-bottom:25px;
}

/* =========================
MOVIES
========================= */

.movie-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:25px;
}

.movie-card{
background:#1b2530;
border-radius:12px;
overflow:hidden;
transition:0.3s;
position:relative;
}

.movie-card:hover{
transform:scale(1.05);
}

.movie-poster{
width:100%;
height:330px;
object-fit:cover;
}

.movie-info{
padding:15px;
}

.movie-title{
font-size:20px;
margin-bottom:15px;
}

.watch-btn{
width:100%;
padding:12px;
border:none;
background:#00a8e1;
color:white;
border-radius:8px;
cursor:pointer;
}

.premium-badge{
position:absolute;
top:10px;
left:10px;
background:gold;
color:black;
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

/* =========================
PLAYER
========================= */

.movie-modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:none;
justify-content:center;
align-items:center;
z-index:999999;
padding:20px;
}

.modal-content{
width:100%;
max-width:1100px;
position:relative;
}

.close-btn{
position:absolute;
top:-50px;
right:0;
font-size:45px;
cursor:pointer;
color:white;
}

/* =========================
HISTORY
========================= */

.history-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

/* =========================
CHAT
========================= */

.chat-toggle{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
border:none;
border-radius:50%;
background:#00a8e1;
color:white;
font-size:25px;
cursor:pointer;
z-index:999999;
}

.chat-box{
position:fixed;
right:20px;
bottom:90px;
width:320px;
height:420px;
background:#1b2530;
border-radius:12px;
overflow:hidden;
display:none;
flex-direction:column;
z-index:999999;
}

.chat-header{
background:#00a8e1;
padding:15px;
font-weight:bold;
}

.chat-messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.chat-message{
background:#273444;
padding:10px;
border-radius:8px;
margin-bottom:10px;
}

.chat-input-area{
display:flex;
}

.chat-input-area input{
flex:1;
padding:14px;
border:none;
outline:none;
}

.chat-input-area button{
width:90px;
border:none;
background:#00a8e1;
color:white;
cursor:pointer;
}

/* =========================
LOGIN
========================= */

.login-modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.92);
display:flex;
justify-content:center;
align-items:center;
z-index:1000000;
}

.login-box{
width:350px;
background:#1b2530;
padding:30px;
border-radius:12px;
text-align:center;
}

.login-box h2{
margin-bottom:15px;
}

.login-box p{
margin-bottom:20px;
color:#ccc;
}

.google-btn{
width:100%;
padding:12px;
border:none;
background:#00a8e1;
color:white;
border-radius:8px;
cursor:pointer;
}

/* MOBILE */

@media(max-width:768px){

body{
padding-top:140px;
}

.navbar{
flex-direction:column;
height:auto;
padding:20px;
gap:20px;
}

.banner-content h1{
font-size:42px;
}

.home-banner{
height:auto;
padding:30px;
}

.search-box input{
width:150px;
}

}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">
MY <span>MOVIE SPACE</span>
</div>

<div class="menu">

<button onclick="filterCategory('all')">Home</button>

<button onclick="filterCategory('bollywood')">
Bollywood
</button>

<button onclick="filterCategory('hollywood')">
Hollywood
</button>

<button onclick="filterCategory('tollywood')">
Tollywood
</button>

<button onclick="filterCategory('song')">
Songs
</button>

<button onclick="toggleSettings()">
⚙ Settings
</button>

</div>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search Movies..."
onkeyup="liveSearch()"
>

<button onclick="liveSearch()">
Search
</button>

</div>

</div>

<!-- SETTINGS -->

<div
class="settings-panel"
id="settingsPanel"
>

<button onclick="toggleTheme()">
🌗 Toggle Theme
</button>

<button onclick="clearHistory()">
🗑 Clear History
</button>

</div>

<!-- BANNER -->

<div class="home-banner">

<div class="banner-content">

<h1>
Watch Movies Online
</h1>

<p>
Stream Bollywood, Hollywood, South Movies and Songs in HD Quality.
</p>

<button
class="banner-btn"
onclick="playMovie('meri kayenat.mp4','Meri Kayenat')"
>
▶ Watch Now
</button>

</div>

</div>

<!-- MOVIES -->

<div class="section">

<h2 class="section-title">
Latest Uploads
</h2>

<div
class="movie-grid"
id="movieGrid"
></div>

</div>

<!-- HISTORY -->

<div class="section">

<h2 class="section-title">
Watch History
</h2>

<div
class="history-grid"
id="historyGrid"
></div>

</div>

<!-- PLAYER -->

<div
class="movie-modal"
id="movieModal"
>

<div class="modal-content">

<span
class="close-btn"
onclick="closeMovie()"
>
✕
</span>

<div id="playerContainer"></div>

</div>

</div>

<!-- LOGIN -->

<div
class="login-modal"
id="loginModal"
>

<div class="login-box">

<h2>
Google Login
</h2>

<p>
Continue with Google
</p>

<button
class="google-btn"
id="googleLoginBtn"
>
Continue With Google
</button>

</div>

</div>

<!-- CHAT -->

<button
class="chat-toggle"
onclick="toggleChat()"
>
💬
</button>

<div
class="chat-box"
id="chatBox"
>

<div class="chat-header">
Live Chat
</div>

<div
class="chat-messages"
id="chatMessages"
></div>

<div class="chat-input-area">

<input
type="text"
id="chatInput"
placeholder="Type Message..."
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script>

/* =========================
FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey: "YOUR_API_KEY",

authDomain: "YOUR_AUTH_DOMAIN",

projectId: "YOUR_PROJECT_ID",

appId: "YOUR_APP_ID"

};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

/* =========================
MOVIES
========================= */

let movieDatabase = [

{
title:"Meri Kayenat",
category:"song",
videoUrl:"meri kayenat.mp4",
poster:"ffhhh.png"
},

{
title:"Yari",
category:"song",
videoUrl:"yari song.mp4",
poster:"yari poster.png"
},

{
title:"Madam Ji Gunde",
category:"song",
videoUrl:"gunda movie.mp4",
poster:"avengers.png"
},

{
title:"Pushpa 2",
category:"tollywood",
videoUrl:"https://drive.google.com/file/d/10BdVjLetH_2rOT8md0roVHPIkZSK2XiS/preview",
poster:"default.jpg",
premium:true
},

{
title:"Animal",
category:"bollywood",
videoUrl:"https://drive.google.com/file/d/10BdVjLetH_2rOT8md0roVHPIkZSK2XiS/preview",
poster:"default.jpg"
},

{
title:"Your Movie Name",
category:"bollywood",
videoUrl:"https://drive.google.com/file/d/16hcez9hDAKDwFIz0VArYGh-4zK964qhF/view?t=2146.42",
poster:"poster.jpg"
},

  {
title:"Welcome to the Jungle",
category:"bollywood",
videoUrl:"https://drive.google.com/file/d/16hcez9hDAKDwFIz0VArYGh-4zK964qhF/view?usp=sharing",
poster:"welcome to the jungle movie poster .png"
}

];

/* =========================
RENDER MOVIES
========================= */

function renderMovies(movies){

const movieGrid =
document.getElementById("movieGrid");

movieGrid.innerHTML = "";

movies.forEach((movie)=>{

movieGrid.innerHTML += `

<div class="movie-card">

${movie.premium ?

`<div class="premium-badge">
PREMIUM
</div>`

: ""}

<img
src="${movie.poster}"
class="movie-poster"
>

<div class="movie-info">

<h3 class="movie-title">
${movie.title}
</h3>

<button
class="watch-btn"
onclick="playMovie('${movie.videoUrl}','${movie.title}')"
>
▶ Watch Now
</button>

</div>

</div>

`;

});

}

/* =========================
PLAY MOVIE
========================= */

function playMovie(videoPath,movieTitle){

saveWatchHistory(movieTitle);

renderHistory();

const modal =
document.getElementById("movieModal");

const container =
document.getElementById("playerContainer");

modal.style.display = "flex";

/* GOOGLE DRIVE */

if(videoPath.includes("drive.google.com")){

container.innerHTML = `

<iframe
src="${videoPath}?autoplay=1"
width="100%"
height="600"
allow="autoplay; fullscreen"
allowfullscreen
style="
border:none;
border-radius:12px;
background:black;
">
</iframe>

`;

}

/* MP4 */

else{

container.innerHTML = `

<video
width="100%"
controls
autoplay
style="
border-radius:12px;
background:black;
"
>

<source
src="${videoPath}"
type="video/mp4"
>

</video>

`;

}

}

/* =========================
CLOSE PLAYER
========================= */

function closeMovie(){

document
.getElementById("movieModal")
.style.display = "none";

document
.getElementById("playerContainer")
.innerHTML = "";

}

/* =========================
SEARCH
========================= */

function liveSearch(){

const value =
document
.getElementById("searchInput")
.value
.toLowerCase();

const filtered =
movieDatabase.filter((movie)=>

movie.title
.toLowerCase()
.includes(value)

);

renderMovies(filtered);

}

/* =========================
CATEGORY
========================= */

function filterCategory(category){

if(category === "all"){

renderMovies(movieDatabase);

}

else{

const filtered =
movieDatabase.filter((movie)=>

movie.category === category

);

renderMovies(filtered);

}

}

/* =========================
WATCH HISTORY
========================= */

function saveWatchHistory(movieTitle){

let history =
JSON.parse(
localStorage.getItem("watchHistory")
) || [];

if(!history.includes(movieTitle)){

history.unshift(movieTitle);

localStorage.setItem(
"watchHistory",
JSON.stringify(history)
);

}

}

function renderHistory(){

const historyGrid =
document.getElementById("historyGrid");

let history =
JSON.parse(
localStorage.getItem("watchHistory")
) || [];

historyGrid.innerHTML = "";

history.forEach((movie)=>{

historyGrid.innerHTML += `

<div class="movie-card">

<div class="movie-info">

<h3 class="movie-title">
${movie}
</h3>

</div>

</div>

`;

});

}

function clearHistory(){

localStorage.removeItem(
"watchHistory"
);

renderHistory();

}

/* =========================
SETTINGS
========================= */

function toggleSettings(){

const panel =
document.getElementById("settingsPanel");

if(panel.style.display === "block"){

panel.style.display = "none";

}

else{

panel.style.display = "block";

}

}

/* =========================
THEME
========================= */

function toggleTheme(){

document.body.classList.toggle(
"light-theme"
);

localStorage.setItem(
"theme",

document.body.classList.contains("light-theme")
? "light"
: "dark"
);

}

const savedTheme =
localStorage.getItem("theme");

if(savedTheme === "light"){

document.body.classList.add(
"light-theme"
);

}

/* =========================
CHAT
========================= */

function toggleChat(){

const chat =
document.getElementById("chatBox");

if(chat.style.display === "flex"){

chat.style.display = "none";

}

else{

chat.style.display = "flex";

}

}

function sendMessage(){

const input =
document.getElementById("chatInput");

const messages =
document.getElementById("chatMessages");

if(input.value.trim() === "") return;

messages.innerHTML += `

<div class="chat-message">
${input.value}
</div>

`;

const userMessage =
input.value.toLowerCase();

input.value = "";

setTimeout(()=>{

let reply =
"Hello 👋";

if(userMessage.includes("movie")){

reply = "New Movies Coming Soon 🎬";

}

if(userMessage.includes("song")){

reply = "Latest Songs Available 🎵";

}

if(userMessage.includes("hello")){

reply = "Hello User 👋 Welcome";

}

messages.innerHTML += `

<div class="chat-message">
${reply}
</div>

`;

messages.scrollTop =
messages.scrollHeight;

},1000);

}

/* =========================
REAL GOOGLE LOGIN
========================= */

document
.getElementById("googleLoginBtn")
.addEventListener("click",()=>{

const provider =
new firebase.auth.GoogleAuthProvider();

auth.signInWithPopup(provider)

.then((result)=>{

const user = result.user;

localStorage.setItem(
"movieUser",
user.displayName
);

document
.getElementById("loginModal")
.style.display = "none";

})

.catch((error)=>{

alert(error.message);

});

});

/* AUTO LOGIN */

const savedUser =
localStorage.getItem("movieUser");

if(savedUser){

document
.getElementById("loginModal")
.style.display = "none";

}

/* =========================
INITIAL LOAD
========================= */

renderMovies(movieDatabase);

renderHistory();

</script>

</body>
</html>
