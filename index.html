<style>

<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey: "AIzaSyBxf8UpDKcgyjborhumZkTSXllUjsYXZC0",

authDomain: "my-deta-center-mujeb-122.firebaseapp.com",

projectId: "my-deta-center-mujeb-122",

storageBucket: "my-deta-center-mujeb-122.firebasestorage.app",

messagingSenderId: "722991037380",

appId: "1:722991037380:web:7e0322c4ccd0d22fe90291",

measurementId: "G-CCYZRM16C6"

};

/* =========================
   INITIALIZE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

const db = getFirestore(app);

/* =========================
   ELEMENTS
========================= */

const loginBtn =
document.getElementById("loginBtn");

const googleLoginBtn =
document.getElementById("googleLoginBtn");

const loginModal =
document.getElementById("loginModal");

const logoutBtn =
document.getElementById("logoutBtn");

const userProfile =
document.getElementById("userProfile");

const userPhoto =
document.getElementById("userPhoto");

const userName =
document.getElementById("userName");

const userCode =
document.getElementById("userCode");

/* =========================
   OPEN LOGIN
========================= */

loginBtn.onclick = ()=>{

loginModal.style.display = "flex";

};

/* =========================
   GOOGLE LOGIN
========================= */

googleLoginBtn.onclick = async ()=>{

try{

const result =
await signInWithPopup(auth,provider);

const user = result.user;

const randomCode =
"USER" +
Math.floor(
100000 + Math.random()*900000
);

await setDoc(

doc(db,"users",user.uid),

{
name:user.displayName,
email:user.email,
photo:user.photoURL,
userCode:randomCode,
uid:user.uid
}

);

loginModal.style.display = "none";

alert("Login Successful");

}

catch(error){

alert(error.message);

}

};

/* =========================
   USER STATE
========================= */

onAuthStateChanged(auth,(user)=>{

if(user){

loginBtn.style.display = "none";

userProfile.style.display = "flex";

userPhoto.src =
user.photoURL;

userName.innerText =
user.displayName;

userCode.innerText =
"Verified User";

}

else{

loginBtn.style.display = "block";

userProfile.style.display = "none";

}

});

/* =========================
   LOGOUT
========================= */

logoutBtn.onclick = ()=>{

signOut(auth);

};

/* =========================
   LANGUAGE CHANGE
========================= */

const languageSelect =
document.getElementById("languageSelect");

languageSelect.addEventListener(
"change",
()=>{

const value =
languageSelect.value;

if(value === "hindi"){

document.querySelector(
".banner-content h1"
).innerText =
"ऑनलाइन मूवी देखें";

}

else if(value === "urdu"){

document.querySelector(
".banner-content h1"
).innerText =
"آن لائن مووی دیکھیں";

}

else{

document.querySelector(
".banner-content h1"
).innerText =
"Watch Movies Online";

}

}
);

</script>
