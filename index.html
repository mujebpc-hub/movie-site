<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY MOVIE SPACE</title>

<link rel="icon" type="image/png" href="ChatGPT Image May 18, 2026, 01_05_09 PM.png">

<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#00050d;
    color:white;
    padding-top:70px;
}

/* =========================
   PRIME VIDEO NAVBAR
========================= */

.navbar{
    width:100%;
    height:70px;
    background:#0f171e;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 45px;
    position:fixed;
    top:0;
    left:0;
    z-index:9999;
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:white;
}

.logo span{
    color:#00a8e1;
}

.menu{
    display:flex;
    align-items:center;
    gap:25px;
}

.menu button{
    background:none;
    border:none;
    color:#ffffffb3;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.menu button:hover{
    color:white;
}

.language-select{
    background:#1a242f;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:6px;
    cursor:pointer;
}

.search-box{
    display:flex;
    align-items:center;
    background:#1a242f;
    border-radius:8px;
    overflow:hidden;
}

.search-box input{
    width:220px;
    padding:12px;
    border:none;
    outline:none;
    background:transparent;
    color:white;
}

.search-box button{
    padding:12px 18px;
    border:none;
    background:#00a8e1;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   HOME BANNER
========================= */

.home-banner{
    width:100%;
    height:520px;

    background:
    linear-gradient(to right,
    rgba(0,0,0,0.95),
    rgba(0,0,0,0.5),
    rgba(0,0,0,0.1)),
    url('ffhhh.png');

    background-size:cover;
    background-position:center;

    display:flex;
    align-items:center;

    padding:70px;
}

.banner-content{
    max-width:600px;
}

.banner-content h1{
    font-size:65px;
    margin-bottom:20px;
}

.banner-content p{
    color:#ddd;
    line-height:30px;
    margin-bottom:30px;
    font-size:18px;
}

.banner-btn{
    padding:16px 35px;
    border:none;
    background:white;
    color:black;
    font-size:18px;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
}

/* =========================
   MOVIE SECTION
========================= */

.section{
    padding:40px;
}

.section-title{
    font-size:32px;
    margin-bottom:25px;
}

/* =========================
   MOVIE GRID
========================= */

.movie-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:25px;
}

/* =========================
   MOVIE CARD
========================= */

.movie-card{
    background:#1b2530;
    border-radius:10px;
    overflow:hidden;
    transition:0.3s;
}

.movie-card:hover{
    transform:scale(1.05);
}

.movie-poster{
    width:100%;
    height:330px;
    object-fit:cover;
}

.movie-info{
    padding:15px;
}

.movie-title{
    font-size:20px;
    margin-bottom:15px;
}

.watch-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#00a8e1;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

/* =========================
   VIDEO MODAL
========================= */

.movie-modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:99999;
    padding:20px;
}

.modal-content{
    width:100%;
    max-width:1000px;
    position:relative;
}

.modal-content video{
    width:100%;
    border-radius:12px;
    background:black;
}

.close-btn{
    position:absolute;
    top:-50px;
    right:0;
    color:white;
    font-size:40px;
    cursor:pointer;
}

/* =========================
   LOGIN MODAL
========================= */

.login-modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:100000;
}

.login-box{
    width:350px;
    background:#1b2530;
    padding:30px;
    border-radius:12px;
    text-align:center;
}

.login-box h2{
    margin-bottom:15px;
}

.login-box p{
    margin-bottom:20px;
    color:#ccc;
}

.google-btn,
#saveUserBtn{
    width:100%;
    padding:12px;
    border:none;
    background:#00a8e1;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

#fullName{
    width:100%;
    padding:12px;
    margin-top:15px;
    margin-bottom:15px;
    border:none;
    border-radius:6px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    body{
        padding-top:140px;
    }

    .navbar{
        height:auto;
        flex-direction:column;
        gap:20px;
        padding:20px;
    }

    .menu{
        flex-wrap:wrap;
        justify-content:center;
    }

    .home-banner{
        height:auto;
        padding:40px 20px;
    }

    .banner-content h1{
        font-size:42px;
    }

    .search-box input{
        width:160px;
    }

}

</style>

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<div class="navbar">

    <div class="logo">
        MY <span>MOVIE SPACE</span>
    </div>

    <div class="menu">

        <button onclick="filterCategory('all')">
            Home
        </button>

        <button onclick="filterCategory('bollywood')">
            Bollywood
        </button>

        <button onclick="filterCategory('hollywood')">
            Hollywood
        </button>

        <button onclick="filterCategory('tollywood')">
            Tollywood
        </button>

        <button onclick="filterCategory('south')">
            South
        </button>

        <button onclick="filterCategory('song')">
            Songs
        </button>

    </div>

    <select class="language-select">

        <option>
            ENG
        </option>

        <option>
            HINDI
        </option>

    </select>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search movies..."
            onkeyup="liveSearch()"
        >

        <button onclick="liveSearch()">
            Search
        </button>

    </div>

</div>

<!-- =========================
     BANNER
========================= -->

<div class="home-banner">

    <div class="banner-content">

        <h1>
            Watch Movies Online
        </h1>

        <p>
            Stream Bollywood, Hollywood, South movies and songs online in HD quality.
        </p>

        <button
            class="banner-btn"
            onclick="playMovie('meri kayenat.mp4')"
        >
            ▶ Watch Now
        </button>

    </div>

</div>

<!-- =========================
     MOVIES
========================= -->

<div class="section">

    <h2 class="section-title">
        Latest Uploads
    </h2>

    <div
        class="movie-grid"
        id="movieGrid"
    ></div>

</div>

<!-- =========================
     VIDEO PLAYER
========================= -->

<div class="movie-modal" id="movieModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeMovie()">✕</span>
        
        <!-- Google Drive के लिए IFRAME use करें (बेहतर है) -->
        <iframe
            id="moviePlayer"
            width="100%"
            height="600"
            style="border-radius:12px;"
            allow="autoplay"
        ></iframe>
    </div>
</div>

<script>

function playMovie(videoUrl){

    let playerArea = document.getElementById("playerArea");

    // GOOGLE DRIVE PREVIEW LINK CHECK
    if(videoUrl.includes("drive.google.com")){

        playerArea.innerHTML = `
            <iframe
                src="${videoUrl}"
                width="100%"
                height="500px"
                allow="autoplay"
                allowfullscreen
                style="border:none;border-radius:10px;">
            </iframe>
        `;

    }

    // NORMAL MP4 VIDEO
    else{

        playerArea.innerHTML = `
            <video
                width="100%"
                height="500px"
                controls
                autoplay
                style="border-radius:10px; background:black;">

                <source src="${videoUrl}" type="video/mp4">

            </video>
        `;

    }

}

</script>

<!-- =========================
     LOGIN MODAL
========================= -->

<div
    id="loginModal"
    class="login-modal"
>

    <div class="login-box">

        <h2>
            Login Required
        </h2>

        <p>
            Please login to continue
        </p>

        <button
            id="googleLoginBtn"
            class="google-btn"
        >
            Continue with Google
        </button>

        <div
            id="userFormBox"
            style="display:none;"
        >

            <input
                type="text"
                id="fullName"
                placeholder="Enter Your Name"
            >

            <button id="saveUserBtn">
                Save & Continue
            </button>

        </div>

    </div>

</div>

<!-- =========================
     JAVASCRIPT
========================= -->

<script>

/* =========================
   MOVIE DATABASE
========================= */

let movieDatabase = [

    {
        title:"Meri Kayenat",
        category:"song",
        videoUrl:"meri kayenat.mp4",
        poster:"ffhhh.png"
    },

    {
        title:"Yari",
        category:"song",
        videoUrl:"yari song.mp4",
        poster:"yari poster.png"
    },

    {
        title:"Madam Ji Gunde",
        category:"song",
        videoUrl:"gunda movie.mp4",
        poster:"avengers.png"
    },

    {
        title:"Satyammurti",
        category:"tollywood",
        videoUrl:"default.mp4",
        poster:"default.jpg"
    },

    {
        title:"Housefull 5",
        category:"bollywood",
        videoUrl:"default.mp4",
        poster:"default.jpg"
    },

    {
        title:"KGF Chapter 2",
        category:"south",
        videoUrl:"default.mp4",
        poster:"default.jpg"
    },

    {
        title:"Pushpa 2",
        category:"tollywood",
        videoUrl:"default.mp4",
        poster:"default.jpg"
    },

    {
        title:"Avengers Endgame",
        category:"hollywood",
        videoUrl:"default.mp4",
        poster:"default.jpg"
    },

    {
        title:"Animal",
        category:"bollywood",
        videoUrl:"default.mp4",
        poster:"default.jpg"
    }

];

/* =========================
   RENDER MOVIES
========================= */

function renderMovies(movies){

    const movieGrid =
    document.getElementById("movieGrid");

    movieGrid.innerHTML = "";

    if(movies.length === 0){

        movieGrid.innerHTML =
        `<h2>No Movie Found</h2>`;

        return;
    }

    movies.forEach((movie)=>{

        movieGrid.innerHTML += `

        <div class="movie-card">

            <img
                src="${movie.poster}"
                class="movie-poster"
            >

            <div class="movie-info">

                <h3 class="movie-title">
                    ${movie.title}
                </h3>

                <button
                    class="watch-btn"
                    onclick="playMovie('${movie.videoUrl}')"
                >
                    ▶ Watch Now
                </button>

            </div>

        </div>

        `;

    });

}

/* =========================
   PLAY MOVIE
========================= */

function playMovie(videoUrl){

    const modal =
    document.getElementById("movieModal");

    const playerArea =
    document.getElementById("playerArea");

    modal.style.display = "flex";

    // GOOGLE DRIVE LINK
    if(videoUrl.includes("drive.google.com")){

        playerArea.innerHTML = `

        <iframe
            src="${videoUrl}"
            width="100%"
            height="600"
            allow="autoplay"
            allowfullscreen
            style="
                border:none;
                border-radius:12px;
                background:black;
            ">
        </iframe>

        `;

    }

    // NORMAL MP4 VIDEO
    else{

        playerArea.innerHTML = `

        <video
            width="100%"
            height="600"
            controls
            autoplay
            style="
                width:100%;
                border-radius:12px;
                background:black;
            ">

            <source
                src="${videoUrl}"
                type="video/mp4"
            >

        </video>

        `;

    }

}

/* =========================
   CLOSE MOVIE
========================= */

function closeMovie(){

    const modal =
    document.getElementById("movieModal");

    const playerArea =
    document.getElementById("playerArea");

    modal.style.display = "none";

    playerArea.innerHTML = "";

}

/* =========================
   LIVE SEARCH
========================= */

function liveSearch(){

    const searchValue =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

    const filteredMovies =
    movieDatabase.filter((movie)=>

        movie.title
        .toLowerCase()
        .includes(searchValue)

    );

    renderMovies(filteredMovies);

}

/* =========================
   CATEGORY FILTER
========================= */

function filterCategory(category){

    if(category === "all"){

        renderMovies(movieDatabase);

    }

    else{

        const filtered =
        movieDatabase.filter((movie)=>

            movie.category === category

        );

        renderMovies(filtered);

    }

}

/* =========================
   LOGIN SYSTEM
========================= */

document
.getElementById("googleLoginBtn")
.addEventListener("click",()=>{

    document
    .getElementById("userFormBox")
    .style.display = "block";

});

document
.getElementById("saveUserBtn")
.addEventListener("click",()=>{

    const name =
    document.getElementById("fullName").value;

    if(name.trim() === ""){

        alert("Please Enter Your Name");

        return;
    }

    localStorage.setItem(
        "movieUser",
        name
    );

    document
    .getElementById("loginModal")
    .style.display = "none";

});

/* =========================
   AUTO LOGIN
========================= */

const savedUser =
localStorage.getItem("movieUser");

if(savedUser){

    document
    .getElementById("loginModal")
    .style.display = "none";

}

/* =========================
   INITIAL LOAD
========================= */

renderMovies(movieDatabase);

</script>

</body>

</html>
