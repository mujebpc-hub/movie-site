<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY MOVIE SPACE</title>

<link rel="icon" type="image/png" href="ChatGPT Image May 18, 2026, 01_05_09 PM.png">

<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#00050d;
    color:white;
    padding-top:80px;
}

/* =========================
   NAVBAR
========================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;
    background:#0f171e;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    z-index:99999;
}

.logo{
    font-size:32px;
    font-weight:bold;
}

.logo span{
    color:#00a8e1;
}

.menu{
    display:flex;
    gap:20px;
}

.menu button{
    background:none;
    border:none;
    color:#ccc;
    cursor:pointer;
    font-size:16px;
}

.menu button:hover{
    color:white;
}

.search-box{
    display:flex;
    background:#1b2530;
    border-radius:8px;
    overflow:hidden;
}

.search-box input{
    border:none;
    background:transparent;
    color:white;
    padding:12px;
    width:220px;
    outline:none;
}

.search-box button{
    border:none;
    background:#00a8e1;
    color:white;
    padding:12px 20px;
    cursor:pointer;
}

/* =========================
   BANNER
========================= */

.home-banner{
    width:100%;
    height:520px;

    background:
    linear-gradient(to right,
    rgba(0,0,0,0.9),
    rgba(0,0,0,0.4)),
    url('ffhhh.png');

    background-size:cover;
    background-position:center;

    display:flex;
    align-items:center;

    padding:60px;
}

.banner-content{
    max-width:600px;
}

.banner-content h1{
    font-size:70px;
    margin-bottom:20px;
}

.banner-content p{
    line-height:30px;
    color:#ddd;
    margin-bottom:30px;
}

.banner-btn{
    padding:15px 35px;
    border:none;
    background:white;
    color:black;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

/* =========================
   SECTION
========================= */

.section{
    padding:40px;
}

.section-title{
    font-size:32px;
    margin-bottom:25px;
}

/* =========================
   MOVIE GRID
========================= */

.movie-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:25px;
}

/* =========================
   MOVIE CARD
========================= */

.movie-card{
    background:#1b2530;
    border-radius:12px;
    overflow:hidden;
    transition:0.3s;
    position:relative;
}

.movie-card:hover{
    transform:scale(1.05);
}

.movie-poster{
    width:100%;
    height:330px;
    object-fit:cover;
}

.movie-info{
    padding:15px;
}

.movie-title{
    font-size:20px;
    margin-bottom:15px;
}

.watch-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#00a8e1;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.premium-badge{
    position:absolute;
    top:10px;
    left:10px;
    background:gold;
    color:black;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

/* =========================
   PLAYER
========================= */

.movie-modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999999;
    padding:20px;
}

.modal-content{
    width:100%;
    max-width:1100px;
    position:relative;
}

.close-btn{
    position:absolute;
    top:-50px;
    right:0;
    font-size:45px;
    cursor:pointer;
}

/* =========================
   CONTINUE WATCHING
========================= */

.continue-box{
    margin:40px;
    background:#101820;
    padding:25px;
    border-radius:12px;
}

/* =========================
   HISTORY
========================= */

.history-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
}

/* =========================
   CHAT SYSTEM
========================= */

.chat-toggle{
    position:fixed;
    bottom:20px;
    right:20px;
    width:60px;
    height:60px;
    border:none;
    border-radius:50%;
    background:#00a8e1;
    color:white;
    font-size:26px;
    cursor:pointer;
    z-index:999999;
}

.chat-box{
    position:fixed;
    right:20px;
    bottom:90px;
    width:320px;
    height:420px;
    background:#1b2530;
    border-radius:12px;
    overflow:hidden;
    display:none;
    flex-direction:column;
    z-index:999999;
}

.chat-header{
    background:#00a8e1;
    padding:15px;
    font-weight:bold;
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.chat-message{
    background:#273444;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
}

.chat-input-area{
    display:flex;
}

.chat-input-area input{
    flex:1;
    padding:14px;
    border:none;
    outline:none;
}

.chat-input-area button{
    width:90px;
    border:none;
    background:#00a8e1;
    color:white;
    cursor:pointer;
}

/* =========================
   LOGIN
========================= */

.login-modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.92);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000000;
}

.login-box{
    width:350px;
    background:#1b2530;
    padding:30px;
    border-radius:12px;
    text-align:center;
}

.login-box h2{
    margin-bottom:15px;
}

.login-box p{
    color:#ccc;
    margin-bottom:20px;
}

.google-btn,
#saveUserBtn{
    width:100%;
    padding:12px;
    border:none;
    background:#00a8e1;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

#fullName{
    width:100%;
    padding:12px;
    margin:15px 0;
    border:none;
    border-radius:8px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    body{
        padding-top:140px;
    }

    .navbar{
        flex-direction:column;
        height:auto;
        padding:20px;
        gap:20px;
    }

    .menu{
        flex-wrap:wrap;
        justify-content:center;
    }

    .banner-content h1{
        font-size:45px;
    }

    .home-banner{
        padding:30px;
        height:auto;
    }

}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">
        MY <span>MOVIE SPACE</span>
    </div>

    <div class="menu">

        <button onclick="filterCategory('all')">Home</button>
        <button onclick="filterCategory('bollywood')">Bollywood</button>
        <button onclick="filterCategory('hollywood')">Hollywood</button>
        <button onclick="filterCategory('tollywood')">Tollywood</button>
        <button onclick="filterCategory('song')">Songs</button>

    </div>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search Movies..."
            onkeyup="liveSearch()"
        >

        <button onclick="liveSearch()">
            Search
        </button>

    </div>

</div>

<!-- BANNER -->

<div class="home-banner">

    <div class="banner-content">

        <h1>
            Watch Movies Online
        </h1>

        <p>
            Stream Bollywood, Hollywood, Tollywood and songs online in HD quality.
        </p>

        <button
            class="banner-btn"
            onclick="playMovie('meri kayenat.mp4','Meri Kayenat')"
        >
            ▶ Watch Now
        </button>

    </div>

</div>

<!-- CONTINUE WATCHING -->

<div class="continue-box">

    <h2>
        Continue Watching
    </h2>

    <div id="continueWatching"></div>

</div>

<!-- MOVIES -->

<div class="section">

    <h2 class="section-title">
        Latest Uploads
    </h2>

    <div
        class="movie-grid"
        id="movieGrid"
    ></div>

</div>

<!-- HISTORY -->

<div class="section">

    <h2 class="section-title">
        Watch History
    </h2>

    <div
        class="history-grid"
        id="historyGrid"
    ></div>

</div>

<!-- PLAYER -->

<div
    class="movie-modal"
    id="movieModal"
>

    <div class="modal-content">

        <span
            class="close-btn"
            onclick="closeMovie()"
        >
            ✕
        </span>

        <div id="playerContainer"></div>

    </div>

</div>

<!-- LOGIN -->

<div
    class="login-modal"
    id="loginModal"
>

    <div class="login-box">

        <h2>
            Login Required
        </h2>

        <p>
            Continue to MY MOVIE SPACE
        </p>

        <button
            class="google-btn"
            id="googleLoginBtn"
        >
            Continue
        </button>

        <div
            id="userFormBox"
            style="display:none;"
        >

            <input
                type="text"
                id="fullName"
                placeholder="Enter Your Name"
            >

            <button id="saveUserBtn">
                Save & Continue
            </button>

        </div>

    </div>

</div>

<!-- CHAT -->

<button
    class="chat-toggle"
    onclick="toggleChat()"
>
💬
</button>

<div
    class="chat-box"
    id="chatBox"
>

    <div class="chat-header">
        Live Chat
    </div>

    <div
        class="chat-messages"
        id="chatMessages"
    ></div>

    <div class="chat-input-area">

        <input
            type="text"
            id="chatInput"
            placeholder="Type message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

/* =========================
   MOVIE DATABASE
========================= */

let movieDatabase = [

{
title:"Meri Kayenat",
category:"song",
videoUrl:"meri kayenat.mp4",
poster:"ffhhh.png"
},

{
title:"Pushpa 2",
category:"tollywood",
videoUrl:"https://drive.google.com/file/d/10BdVjLetH_2rOT8md0roVHPIkZSK2XiS/preview",
poster:"default.jpg",
premium:true
},

{
title:"Animal",
category:"bollywood",
videoUrl:"https://drive.google.com/file/d/10BdVjLetH_2rOT8md0roVHPIkZSK2XiS/preview",
poster:"default.jpg"
}

];

/* =========================
   RENDER MOVIES
========================= */

function renderMovies(movies){

const movieGrid =
document.getElementById("movieGrid");

movieGrid.innerHTML = "";

movies.forEach((movie)=>{

movieGrid.innerHTML += `

<div class="movie-card">

${movie.premium ?
`<div class="premium-badge">PREMIUM</div>`
: ""
}

<img
src="${movie.poster}"
class="movie-poster"
>

<div class="movie-info">

<h3 class="movie-title">
${movie.title}
</h3>

<button
class="watch-btn"
onclick="playMovie('${movie.videoUrl}','${movie.title}')"
>
▶ Watch Now
</button>

</div>

</div>

`;

});

}

/* =========================
   PLAY MOVIE
========================= */

function playMovie(videoPath,movieTitle){

saveWatchHistory(movieTitle);

renderHistory();

const modal =
document.getElementById("movieModal");

const container =
document.getElementById("playerContainer");

modal.style.display = "flex";

/* GOOGLE DRIVE */

if(videoPath.includes("drive.google.com")){

container.innerHTML = `

<iframe
src="${videoPath}?autoplay=1"
width="100%"
height="600"
allow="autoplay; fullscreen"
allowfullscreen
style="
border:none;
border-radius:12px;
background:black;
">
</iframe>

`;

}

/* MP4 */

else{

container.innerHTML = `

<video
id="moviePlayer"
width="100%"
controls
autoplay
style="
border-radius:12px;
background:black;
"
>

<source
src="${videoPath}"
type="video/mp4"
>

</video>

`;

}

}

/* =========================
   CLOSE MOVIE
========================= */

function closeMovie(){

document
.getElementById("movieModal")
.style.display = "none";

document
.getElementById("playerContainer")
.innerHTML = "";

}

/* =========================
   SEARCH
========================= */

function liveSearch(){

const value =
document
.getElementById("searchInput")
.value
.toLowerCase();

const filtered =
movieDatabase.filter((movie)=>

movie.title
.toLowerCase()
.includes(value)

);

renderMovies(filtered);

}

/* =========================
   CATEGORY
========================= */

function filterCategory(category){

if(category === "all"){

renderMovies(movieDatabase);

}

else{

const filtered =
movieDatabase.filter((movie)=>

movie.category === category

);

renderMovies(filtered);

}

}

/* =========================
   WATCH HISTORY
========================= */

function saveWatchHistory(movieTitle){

let history =
JSON.parse(
localStorage.getItem("watchHistory")
) || [];

if(!history.includes(movieTitle)){

history.unshift(movieTitle);

localStorage.setItem(
"watchHistory",
JSON.stringify(history)
);

}

}

/* =========================
   RENDER HISTORY
========================= */

function renderHistory(){

const historyGrid =
document.getElementById("historyGrid");

let history =
JSON.parse(
localStorage.getItem("watchHistory")
) || [];

historyGrid.innerHTML = "";

history.forEach((movie)=>{

historyGrid.innerHTML += `

<div class="movie-card">

<div class="movie-info">

<h3 class="movie-title">
${movie}
</h3>

</div>

</div>

`;

});

}

/* =========================
   CHAT
========================= */

function toggleChat(){

const chat =
document.getElementById("chatBox");

if(chat.style.display === "flex"){

chat.style.display = "none";

}

else{

chat.style.display = "flex";

}

}

function sendMessage(){

const input =
document.getElementById("chatInput");

const messages =
document.getElementById("chatMessages");

if(input.value.trim() === "") return;

messages.innerHTML += `

<div class="chat-message">
${input.value}
</div>

`;

input.value = "";

messages.scrollTop =
messages.scrollHeight;

}

/* =========================
   LOGIN
========================= */

document
.getElementById("googleLoginBtn")
.addEventListener("click",()=>{

document
.getElementById("userFormBox")
.style.display = "block";

});

document
.getElementById("saveUserBtn")
.addEventListener("click",()=>{

const name =
document.getElementById("fullName").value;

if(name.trim() === ""){

alert("Enter Your Name");

return;

}

localStorage.setItem(
"movieUser",
name
);

document
.getElementById("loginModal")
.style.display = "none";

});

/* AUTO LOGIN */

const savedUser =
localStorage.getItem("movieUser");

if(savedUser){

document
.getElementById("loginModal")
.style.display = "none";

}

/* =========================
   INITIAL LOAD
========================= */

renderMovies(movieDatabase);

renderHistory();

</script>

</body>
</html>
