<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Stream - Premium Movies</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold text-red-600 tracking-wider">CINEMATIC</div>
        <div class="w-1/3">
            <input type="text" placeholder="Search movies, genres..." class="w-full bg-white/10 text-white rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 border border-white/10">
        </div>
        <div class="flex gap-4 text-sm font-medium text-gray-300">
            <a href="#" class="hover:text-white transition">Home</a>
            <a href="#" class="hover:text-white transition">Movies</a>
        </div>
    </nav>

    <!-- Hero Movie Banner -->
    <header class="relative w-full h-[50vh] bg-gradient-to-r from-black via-transparent to-black flex items-center px-12">
        <div class="absolute inset-0 bg-cover bg-center -z-10 opacity-40" style="background-image: url('https://unsplash.com');"></div>
        <div class="max-w-xl space-y-4">
            <span class="bg-red-600 text-xs px-3 py-1 rounded-full font-bold">TRENDING</span>
            <h1 class="text-4xl font-extrabold tracking-tight">The Future of Streaming</h1>
            <p class="text-gray-400 text-sm">Experience licensed, high-quality public domain cinema and original films with butter-smooth streaming speeds.</p>
            <button class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-2.5 rounded-lg transition shadow-lg shadow-red-600/30">Watch Now</button>
        </div>
    </header>

    <!-- Movie Grid -->
    <main class="p-12 space-y-6">
        <h2 class="text-xl font-bold border-l-4 border-red-600 pl-3">Popular Releases</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <!-- Card 1 -->
            <div class="glass rounded-xl overflow-hidden group cursor-pointer transition transform hover:scale-105">
                <div class="aspect-[2/3] bg-gray-800">
                    <img src="https://unsplash.com" alt="Movie Poster" class="w-full h-full object-cover">
                </div>
                <div class="p-4"><h3 class="font-semibold text-sm truncate">Sample Movie Title</h3></div>
            </div>
        </div>
    </main>
</body>
</html>
