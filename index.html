<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Search UI</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .container{
      width:90%;
      max-width:700px;
      background:white;
      padding:40px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
      text-align:center;
    }

    h1{
      font-size:40px;
      margin-bottom:25px;
      color:#111;
    }

    .search-box{
      width:100%;
      display:flex;
      gap:10px;
      margin-bottom:40px;
    }

    .search-box input{
      flex:1;
      padding:15px;
      border:2px solid #ddd;
      border-radius:12px;
      font-size:16px;
      outline:none;
    }

    .search-box button{
      padding:15px 25px;
      border:none;
      background:#111;
      color:white;
      border-radius:12px;
      cursor:pointer;
      font-size:16px;
    }

    .search-box button:hover{
      background:#333;
    }

    .empty{
      padding:60px 20px;
      border:2px dashed #ddd;
      border-radius:20px;
      color:#888;
      font-size:20px;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>Movie Search</h1>

    <div class="search-box">
      <input type="text" placeholder="Search movies...">
      <button>Search</button>
    </div>

    <div class="empty">
      No Movie Available
    </div>

  </div>

</body>
</html>
