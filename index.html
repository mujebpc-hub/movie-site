<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MYMOVIES</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }



        body{
            background:#0f0f0f;
            color:white;
        }



        /* =========================
           NAVBAR
        ========================== */

        .navbar{

            width:100%;

            background:#111;

            padding:18px 40px;

            display:flex;

            justify-content:space-between;

            align-items:center;

            position:sticky;

            top:0;

            z-index:999;

            border-bottom:1px solid #222;
        }



        .logo{

            font-size:38px;

            font-weight:bold;

            color:#7ac943;
        }



        .menu{

            display:flex;

            gap:30px;
        }



        .menu a{

            text-decoration:none;

            color:white;

            font-size:15px;

            font-weight:bold;

            transition:0.3s;
        }



        .menu a:hover{

            color:#7ac943;
        }



        .search-box{

            display:flex;
        }



        .search-box input{

            width:250px;

            padding:12px;

            border:none;

            outline:none;

            background:#222;

            color:white;
        }



        .search-box button{

            padding:12px 20px;

            border:none;

            background:#7ac943;

            color:white;

            cursor:pointer;
        }



        /* =========================
           HOME BANNER
        ========================== */

        .home-banner{

            width:100%;

            padding:80px 30px;

            text-align:center;

            background:linear-gradient(
                rgba(0,0,0,0.8),
                rgba(0,0,0,0.8)
            ),

            url('poster.png');

            background-size:cover;

            background-position:center;
        }



        .home-banner h1{

            font-size:65px;

            margin-bottom:20px;
        }



        .home-banner p{

            max-width:700px;

            margin:auto;

            color:#ccc;

            line-height:30px;

            font-size:18px;
        }



        /* =========================
           MOVIE SECTION
        ========================== */

        .section{

            padding:50px 40px;
        }



        .section-title{

            font-size:35px;

            margin-bottom:30px;
        }



        /* =========================
           MOVIE GRID
        ========================== */

        .movie-grid{

            display:grid;

            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

            gap:25px;
        }



        /* =========================
           MOVIE CARD
        ========================== */

        .movie-card{

            background:#1b1b1b;

            border-radius:12px;

            overflow:hidden;

            transition:0.3s;

            cursor:pointer;
        }



        .movie-card:hover{

            transform:translateY(-8px);

            box-shadow:0 10px 20px rgba(0,0,0,0.5);
        }



        .movie-card img{

            width:100%;

            height:320px;

            object-fit:cover;
        }



        .movie-info{

            padding:15px;
        }



        .movie-info h3{

            margin-bottom:15px;

            font-size:20px;
        }



        .watch-btn{

            padding:10px 20px;

            border:none;

            background:#7ac943;

            color:white;

            cursor:pointer;

            border-radius:5px;
        }



        /* =========================
           VIDEO MODAL
        ========================== */

        .movie-modal{

            position:fixed;

            top:0;

            left:0;

            width:100%;

            height:100%;

            background:rgba(0,0,0,0.95);

            display:none;

            justify-content:center;

            align-items:center;

            z-index:9999;

            padding:20px;
        }



        .modal-content{

            width:100%;

            max-width:1000px;

            position:relative;
        }



        .modal-content video{

            width:100%;

            border-radius:15px;

            background:black;
        }



        .close-btn{

            position:absolute;

            top:-50px;

            right:0;

            color:white;

            font-size:40px;

            cursor:pointer;
        }



        /* =========================
           MOBILE
        ========================== */

        @media(max-width:768px){

            .navbar{

                flex-direction:column;

                gap:20px;
            }



            .menu{

                flex-wrap:wrap;

                justify-content:center;
            }



            .home-banner h1{

                font-size:40px;
            }



            .search-box input{

                width:180px;
            }

        }

    </style>

</head>

<body>



    <!-- =========================
         NAVBAR
    ========================== -->

    <div class="navbar">

        <div class="logo">
            MYMOVIES
        </div>



        <div class="menu">

            <a href="#">HOME</a>

            <a href="#">BOLLYWOOD</a>

            <a href="#">HOLLYWOOD</a>

            <a href="#">SERIES</a>

            <a href="#">TRENDING</a>

        </div>



        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search movies..."
            >

            <button onclick="searchMovies()">
                Search
            </button>

        </div>

    </div>



    <!-- =========================
         HOME BANNER
    ========================== -->

    <div class="home-banner">

        <h1>
            Watch Movies Online
        </h1>

        <p>

            Stream your favorite movies and songs online
            in HD quality with a modern movie experience.

        </p>

    </div>



    <!-- =========================
         MOVIE SECTION
    ========================== -->

    <div class="section">

        <h2 class="section-title">
            Latest Uploads
        </h2>



        <div
            class="movie-grid"
            id="movieGrid"
        ></div>

    </div>



    <!-- =========================
         VIDEO MODAL
    ========================== -->

    <div
        class="movie-modal"
        id="movieModal"
    >

        <div class="modal-content">

            <span
                class="close-btn"
                onclick="closeMovie()"
            >
                ✕
            </span>



            <video
                id="moviePlayer"
                controls
                autoplay
            >

                <source
                    id="movieSource"
                    src=""
                    type="video/mp4"
                >

            </video>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        /* =========================
           MOVIE DATABASE
        ========================== */

        let movieDatabase = [

            {

                title:"Meri Kayenat",

                videoUrl:"meri-kayenat.mp4",

                poster:"poster.png"

            }

        ];



        /* =========================
           RENDER MOVIES
        ========================== */

        function renderMovies(movies){

            const movieGrid = document.getElementById("movieGrid");



            movieGrid.innerHTML = "";



            movies.forEach((movie)=>{

                movieGrid.innerHTML += `

                    <div
                        class="movie-card"
                        onclick="playMovie('${movie.videoUrl}')"
                    >

                        <img src="${movie.poster}">

                        <div class="movie-info">

                            <h3>${movie.title}</h3>

                            <button class="watch-btn">

                                ▶ Watch

                            </button>

                        </div>

                    </div>

                `;

            });

        }



        /* =========================
           PLAY MOVIE
        ========================== */

        function playMovie(videoPath){

            const modal = document.getElementById("movieModal");

            const player = document.getElementById("moviePlayer");

            const source = document.getElementById("movieSource");



            source.src = videoPath;

            player.load();



            modal.style.display = "flex";

        }



        /* =========================
           CLOSE MOVIE
        ========================== */

        function closeMovie(){

            const modal = document.getElementById("movieModal");

            const player = document.getElementById("moviePlayer");



            modal.style.display = "none";



            player.pause();

        }



        /* =========================
           SEARCH SYSTEM
        ========================== */

        function searchMovies(){

            const input = document
            .getElementById("searchInput")
            .value
            .toLowerCase();



            const filteredMovies = movieDatabase.filter(

                movie =>

                movie.title.toLowerCase().includes(input)

            );



            renderMovies(filteredMovies);

        }



        /* =========================
           INITIAL LOAD
        ========================== */

        renderMovies(movieDatabase);

    </script>

</body>

</html>
